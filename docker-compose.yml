services:
  # Your local model. Turn it off (COMPOSE_PROFILES= in .env) if you already run a model server elsewhere.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"

  app:
    build: .
    restart: unless-stopped
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API: ${LLM_API:-openai}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      VISION_MODEL: ${VISION_MODEL:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional: public HTTPS address without opening any port (deploy/tunnel.sh turns it on).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [caddy]
    command: tunnel --no-autoupdate --url http://caddy:8081

volumes:
  ollama:
  appdata:
  caddy_data:
  caddy_config:
